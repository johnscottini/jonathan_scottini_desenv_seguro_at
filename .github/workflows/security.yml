name: security-pipeline

# Pipeline DevSecOps do agendamento-api (Exercício 12).
# Roda em todo push e pull request para main, e bloqueia o merge segundo o critério de
# severidade definido em docs/exercicio12_devsecops.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # --- SCA: análise de dependências (fase: commit/build) -------------------------
  # Vem primeiro e barato: uma dependência vulnerável conhecida é o achado mais fácil
  # e mais comum. Gate: qualquer vulnerabilidade conhecida (com correção disponível)
  # bloqueia. Foi este job que pegou o PyJWT 2.13.0 (CVE-2026-102274).
  dependencias-sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: pip install pip-audit
      - name: Auditar dependências (bloqueia em qualquer vulnerabilidade conhecida)
        run: pip-audit -r requirements.txt --strict

  # --- SAST: análise estática (fase: commit/build) -------------------------------
  # Analisa o código-fonte sem executá-lo. Gate: qualquer finding de severidade
  # HIGH bloqueia; MEDIUM/LOW são reportados (bandit sai != 0 só em HIGH aqui).
  estatica-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar bandit
        run: pip install bandit
      - name: Bandit (bloqueia em severidade HIGH)
        run: bandit -r app -ll -ii
        # -ll: reporta a partir de LOW, mas o passo só falha em HIGH (--severity-level high)
      - name: Bandit — gate de severidade HIGH
        run: bandit -r app --severity-level high --confidence-level medium

  # --- Testes de segurança (fase: build/test) ------------------------------------
  # A suíte pytest inclui os testes de autorização derivados do threat model
  # (test_autorizacao.py, test_vulnerabilidades.py, test_hardening.py,
  # test_threat_model.py). Gate: qualquer teste falhando bloqueia.
  testes-seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest httpx2
      - name: pytest (bloqueia em qualquer teste falhando)
        run: pytest -q

  # --- DAST: análise dinâmica (fase: staging, pós-deploy em ambiente efêmero) -----
  # OWASP ZAP em scan passivo contra a aplicação SUBINDO de verdade. Roda depois dos
  # gates baratos passarem, porque precisa da app no ar. Gate: alertas de risco
  # High do ZAP bloqueiam (baseline configurável em .zap/rules.tsv).
  dinamica-dast:
    runs-on: ubuntu-latest
    needs: [dependencias-sca, estatica-sast, testes-seguranca]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Subir a aplicação
        env:
          # Segredos de CI, descartáveis: existem só para a app subir e o ZAP varrer.
          SECRET_KEY: ci-secret-nao-usar-em-producao
          ADMIN_PASSWORD: ci-admin-pass
          LAB_CLIENT_SECRET: ci-lab-secret
          COOKIE_SECURE: "false"
        run: |
          pip install -r requirements.txt
          # setsid + stdin fechada: o processo sai da árvore do passo, senão o runner
          # o mata ao fim do step e o ZAP encontra connection refused no passo seguinte.
          setsid nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > uvicorn.log 2>&1 < /dev/null &
          # Espera a app responder de fato, em vez de apostar num sleep fixo.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "aplicação no ar após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "a aplicação não subiu em 30s; log do uvicorn:"
          cat uvicorn.log
          exit 1

      - name: Confirmar que a aplicação sobreviveu ao fim do passo anterior
        # Diagnóstico: se falhar AQUI, o processo morreu na fronteira entre steps.
        # Se o passo anterior é que falhou, a app nunca subiu. São causas diferentes.
        run: |
          curl -sf http://localhost:8000/ || {
            echo "a aplicação não está mais no ar; log do uvicorn:"
            cat uvicorn.log
            exit 1
          }

      - name: Liberar escrita do container do ZAP no workspace
        # O container roda com outro uid e precisa gravar zap.yaml e os relatórios aqui.
        run: chmod -R a+w "$GITHUB_WORKSPACE"

      - name: OWASP ZAP — scan passivo (baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          # -a: inclui também os alertas informativos no relatório.
          cmd_options: "-a"
          # O job tem permissions: contents:read, então não pode abrir issue.
          allow_issue_writing: false

      - name: Log do uvicorn (se o ZAP falhar)
        if: failure()
        run: cat uvicorn.log || true

# Observação sobre IAST (análise interativa): exigiria instrumentar o runtime da app
# durante os testes funcionais (um agente dentro do processo, correlacionando fluxo de
# dados em tempo de execução). Fica documentado em docs/exercicio12_devsecops.md como a
# evolução natural do pipeline; não é implementado aqui por depender de ferramenta
# comercial/licenciada, mas o ponto de inserção seria o job de testes.
